name: Build Showcase

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [intern-updated]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Aggregate intern repos
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }} # PAT with repo scope, stored as org secret
          ORG: mdap-internship
        run: python scripts/aggregate.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec jekyll build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
