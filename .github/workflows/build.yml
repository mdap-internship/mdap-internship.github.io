name: Build site

on:
   push:
      branches: [main]
   repository_dispatch:
      types: [intern-updated]
   schedule:
     - cron: "0 * * * *" # hourly fallback

jobs:
   build:
      runs-on: ubuntu-latest
      permissions:
         contents: write  # needed for peaceiris/actions-gh-pages to push
      steps:
         - uses: actions/checkout@v4
         - name: Fetch intern profiles
           env:
            GH_TOKEN: ${{ secrets.ORG_PAT }}
           run: |
            python scripts/fetch_profiles.py

         - name: Deploy to Pages
           uses: peaceiris/actions-gh-pages@v3
           with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./dist
