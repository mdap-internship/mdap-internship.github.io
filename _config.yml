# _config.yml
collections:
  interns:
    output: true
    permalink: /interns/:name/

defaults:
  - scope:
      path: "interns"
    values:
      layout: intern

exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/
  - .ruby-version
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby